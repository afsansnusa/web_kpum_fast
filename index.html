<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/x-icon" href="img/cuking.jpg" />
    <title>Kantin NyongBae</title>
  </head>
  <body>
    <div class="navbar">
      <div class="logo">Kantin NyongBae</div>
      <ul class="menu">
        <li><a href="#">Beranda</a></li>
        <li><a href="#">Menu</a></li>
        <li><a href="#">Tentang</a></li>
        <li><a href="#">Kontak</a></li>
      </ul>
    </div>

    <div class="container">
      <h2>Menu Kantin NyongBae</h2>

      <div class="menu-grid">
        <div class="card">
          <img src="img/sate-ayam.jpg" alt="Sate Ayam Ambal" />
          <div class="content">
            <h3>Sate Ayam Ambal</h3>
            <p>Rp 20.000</p>
            <button onclick="window.open('https://instagram.com/fadilif', '_blank')">Pesan</button>
          </div>
        </div>

        <div class="card">
          <img src="img/mendoan.jpg" alt="Mendoan" />
          <div class="content">
            <h3>Mendoan</h3>
            <p>Rp 10.000</p>
            <button>Pesan</button>
          </div>
        </div>

        <div class="card">
          <img src="img/lanting.jpg" alt="Lanting" />
          <div class="content">
            <h3>Lanting</h3>
            <p>Rp 4.000</p>
            <button>Pesan</button>
          </div>
        </div>

        <div class="card">
          <img src="img/roti-bakar.jpg" alt="Roti Bakar" />
          <div class="content">
            <h3>Roti Bakar</h3>
            <p>Rp 10.000</p>
            <button>Pesan</button>
          </div>
        </div>

        <div class="card">
          <img src="img/bakso.jpg" alt="Bakso" />
          <div class="content">
            <h3>Bakso</h3>
            <p>Rp 12.000</p>
            <button>Pesan</button>
          </div>
        </div>

        <div class="card">
          <img src="img/wedang-uwuh.jpg" alt="Wedang Uwuh" />
          <div class="content">
            <h3>Wedang Uwuh</h3>
            <p>Rp 6.000</p>
            <button>Pesan</button>
          </div>
        </div>
      </div>
    </div>

    <div class="footer">Kantin NyongBae &copy; 2026</div>
  </body>
</html>
